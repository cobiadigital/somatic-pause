<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Somatic Pause</title>
  <meta name="description" content="A 90-second pause to get curious about what you feel in your body.">
  <meta name="theme-color" content="#f4efe6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16181d" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Pause">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main id="app" data-state="session">

    <!-- Session -->
    <section class="screen session" aria-label="Pause in progress">
      <div class="field" id="field" aria-live="polite"></div>
      <div class="timer" role="timer" aria-label="Time remaining">
        <svg viewBox="0 0 120 120" aria-hidden="true">
          <circle class="track" cx="60" cy="60" r="54"/>
          <circle class="ring" id="ring" cx="60" cy="60" r="54"/>
        </svg>
        <span class="time" id="time">1:30</span>
      </div>
    </section>

    <!-- Close -->
    <section class="screen outro" aria-labelledby="outro-title">
      <h2 id="outro-title">Ninety seconds.</h2>
      <p class="lede">Notice what's here now.</p>
      <p>Has anything shifted, even a little? Nothing needs to have.</p>
      <button class="primary" id="again" type="button">Pause again</button>
    </section>

  </main>

  <script src="/app.js"></script>
</body>
</html>
