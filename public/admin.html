<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Pause Admin</title>
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/admin.css">
</head>
<body>
  <header>
    <h1>Questions</h1>
    <button class="link" id="signout" type="button" hidden>Sign out</button>
  </header>

  <!-- Sign in -->
  <form id="login" class="card" hidden>
    <label for="password">Admin password</label>
    <input id="password" type="password" autocomplete="current-password" required>
    <button class="primary" type="submit">Sign in</button>
    <p class="hint">This browser will remember it until you sign out.</p>
  </form>

  <!-- Editor -->
  <main id="editor" hidden>
    <p class="note" id="info"></p>
    <div id="groups"></div>
  </main>

  <footer id="bar" hidden>
    <span id="status" role="status" aria-live="polite"></span>
    <button class="quiet" id="reset" type="button">Reset to defaults</button>
    <button class="primary" id="save" type="button" disabled>Save</button>
  </footer>

  <p class="error" id="error" role="alert" hidden></p>

  <script src="/admin.js"></script>
</body>
</html>
